<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
{% include analytics.html %}
<meta name="description" content="{{ page.description | default: site.description }}" />
<meta name="author" content="EarthWise Consultancy LTD" />
<title>{{ page.title | default: site.title }}</title>
<link rel="icon" type="image/png" href="{{ site.baseurl }}/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg" />
<link rel="shortcut icon" href="{{ site.baseurl }}/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/apple-touch-icon.png" />
<link rel="manifest" href="{{ site.baseurl }}/assets/site.webmanifest" />
<script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
<link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />
<link href="{{ site.baseurl }}/css/styles.css" rel="stylesheet" />
{% if page.extra_css %}
<style>{{ page.extra_css }}</style>
{% endif %}
